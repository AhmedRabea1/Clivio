services:
  - type: web
    name: clivio
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.cweoxnvgnlissgcztbdc
      - key: DB_PASSWORD
        sync: false          # you will paste this in the Render dashboard
      - key: DB_HOST
        value: aws-1-eu-central-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
