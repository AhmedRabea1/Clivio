{% extends "base.html" %}

{% block title %}Delete Patient — Clivio{% endblock %}
{% block page_title %}Delete Patient{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="form-card text-center">
      <div class="mb-3" style="font-size:3rem;color:#ef4444">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>
      <h5 class="fw-bold mb-1">Delete Patient</h5>
      <p class="text-muted mb-4">
        Are you sure you want to delete <strong>{{ patient.full_name }}</strong>?
        This action cannot be undone.
      </p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
          <a href="{% url 'patient_list' %}" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
